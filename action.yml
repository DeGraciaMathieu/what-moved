name: What moved
description: Draws on the pull request what it moved among the classes and their dependencies, to know where to look before reading the diff.

inputs:
  source:
    description: Folder of the classes to map, from the project root.
    default: app
  namespace:
    description: Root namespace of the classes in the folder; the segment after it gives the context.
    default: App
  exclude:
    description: Contexts left off the map, comma separated.
    default: ''
  merge:
    description: Contexts merged into another one, as comma separated source:target pairs (Policies:Http).
    default: ''
  config:
    description: JSON file, from the project root, that sets the layers and places each context on the map; see the README.
    default: .github/what-moved.json
  php-version:
    default: '8.2'
  assets-branch:
    description: Orphan branch of the repository that keeps the graph of each pull request, created on the first run.
    default: what-moved-assets
  github-token:
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        path: .what-moved/head

    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: .what-moved/base

    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        coverage: none

    - name: Install the parser
      shell: bash
      working-directory: ${{ github.action_path }}
      run: composer install --no-interaction --prefer-dist --no-progress

    - name: Draw the graph
      shell: bash
      working-directory: .what-moved
      env:
        WHAT_MOVED_SOURCE: ${{ inputs.source }}
        WHAT_MOVED_NAMESPACE: ${{ inputs.namespace }}
        WHAT_MOVED_EXCLUDE: ${{ inputs.exclude }}
        WHAT_MOVED_MERGE: ${{ inputs.merge }}
        CONFIG: ${{ inputs.config }}
      # The base may not have the config file yet: both sides are read with the one of the head.
      run: |
        php "$GITHUB_ACTION_PATH/scripts/graph.php" base "head/$CONFIG" > base.json
        php "$GITHUB_ACTION_PATH/scripts/graph.php" head "head/$CONFIG" > head.json
        php "$GITHUB_ACTION_PATH/scripts/report.php" base.json head.json "head/$CONFIG" out

    # The graph goes to an orphan branch of the repository, so it is shown to whoever can read the repository.
    # The comment links it by commit, so an updated pull request never shows a cached graph.
    - name: Publish the graph
      id: publish
      shell: bash
      working-directory: .what-moved
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        BRANCH: ${{ inputs.assets-branch }}
      run: |
        remote="https://x-access-token:$GH_TOKEN@github.com/$REPO.git"
        if git ls-remote --exit-code --heads "$remote" "$BRANCH" > /dev/null; then
          git clone --quiet --depth 1 --branch "$BRANCH" "$remote" assets
        else
          git init --quiet assets
          git -C assets checkout --quiet --orphan "$BRANCH"
        fi
        mkdir -p "assets/pr-$PR"
        cp out/graph.svg "assets/pr-$PR/graph.svg"
        cd assets
        git add .
        if ! git diff --cached --quiet; then
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --quiet -m "Graph of pull request #$PR"
          # Another pull request may have pushed in between.
          for attempt in 1 2 3 4 5; do
            git push --quiet "$remote" "HEAD:$BRANCH" && break
            [ "$attempt" = 5 ] && exit 1
            git pull --quiet --rebase "$remote" "$BRANCH"
          done
        fi
        echo "url=$GITHUB_SERVER_URL/$REPO/raw/$(git rev-parse HEAD)/pr-$PR/graph.svg" >> "$GITHUB_OUTPUT"

    - name: Keep the report
      id: report
      uses: actions/upload-artifact@v4
      with:
        name: what-moved-report
        path: .what-moved/out/report.html

    - name: Comment on the pull request
      shell: bash
      working-directory: .what-moved
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        GRAPH_URL: ${{ steps.publish.outputs.url }}
        REPORT_URL: ${{ steps.report.outputs.artifact-url }}
      run: |
        {
          cat out/summary.md
          echo
          echo "![What the pull request moved]($GRAPH_URL)"
          echo
          echo "[Explore every class]($REPORT_URL): download the report, then open \`report.html\`."
        } > comment.md
        cat comment.md >> "$GITHUB_STEP_SUMMARY"
        comment=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- what-moved -->")) | .id' | head -n 1)
        if [ -n "$comment" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$comment" -F body=@comment.md > /dev/null
        else
          gh pr comment "$PR" --repo "$REPO" --body-file comment.md
        fi
