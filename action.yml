name: What moved
description: Draws on the pull request what it moved among the classes and their dependencies, to know where to look before reading the diff.

inputs:
  source:
    description: Folder of the classes to map, from the project root.
    default: app
  namespace:
    description: Root namespace of the classes in the folder; the segment after it gives the context.
    default: App
  exclude:
    description: Contexts left off the map, comma separated.
    default: ''
  merge:
    description: Contexts merged into another one, as comma separated source:target pairs (Policies:Http).
    default: ''
  web:
    description: Contexts whose classes all count in the web layer, comma separated.
    default: Http
  web-label:
    description: Label of the web layer in the legend.
    default: Http
  positions:
    description: JSON file, from the project root, placing each context on the map ({"Context": [x, y]}).
    default: .github/what-moved.json
  php-version:
    default: '8.2'
  s3-bucket:
    description: Bucket the graph and the report are published to; the credentials go through AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
    required: true
  s3-endpoint:
    description: S3 endpoint of the bucket.
    required: true
  s3-region:
    default: us-east-1
  s3-prefix:
    description: Folder of the bucket under which each pull request gets a random path.
    default: ci/what-moved
  public-url:
    description: Public URL of the bucket, without a trailing slash.
    required: true
  github-token:
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        path: .what-moved/head

    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: .what-moved/base

    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        coverage: none

    - name: Install the parser
      shell: bash
      working-directory: ${{ github.action_path }}
      run: composer install --no-interaction --prefer-dist --no-progress

    - name: Draw the graph
      shell: bash
      working-directory: .what-moved
      env:
        WHAT_MOVED_SOURCE: ${{ inputs.source }}
        WHAT_MOVED_NAMESPACE: ${{ inputs.namespace }}
        WHAT_MOVED_EXCLUDE: ${{ inputs.exclude }}
        WHAT_MOVED_MERGE: ${{ inputs.merge }}
        WHAT_MOVED_WEB: ${{ inputs.web }}
        WHAT_MOVED_WEB_LABEL: ${{ inputs.web-label }}
        POSITIONS: ${{ inputs.positions }}
      run: |
        php "$GITHUB_ACTION_PATH/scripts/graph.php" base > base.json
        php "$GITHUB_ACTION_PATH/scripts/graph.php" head > head.json
        php "$GITHUB_ACTION_PATH/scripts/report.php" base.json head.json "head/$POSITIONS" out

    # A private repository cannot show an image stored in it: the graph and the report go to the bucket,
    # under a path nobody can guess, readable by whoever has the link.
    - name: Publish the graph
      id: publish
      shell: bash
      working-directory: .what-moved
      env:
        AWS_DEFAULT_REGION: ${{ inputs.s3-region }}
        BUCKET: ${{ inputs.s3-bucket }}
        ENDPOINT: ${{ inputs.s3-endpoint }}
        PREFIX: ${{ inputs.s3-prefix }}
        PUBLIC_URL: ${{ inputs.public-url }}
      run: |
        prefix="$PREFIX/$(openssl rand -hex 16)"
        for file in graph.svg report.html; do
          aws s3 cp "out/$file" "s3://$BUCKET/$prefix/$file" --endpoint-url "$ENDPOINT" --acl public-read --only-show-errors
        done
        echo "url=$PUBLIC_URL/$prefix" >> "$GITHUB_OUTPUT"

    - name: Comment on the pull request
      shell: bash
      working-directory: .what-moved
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        GRAPH_URL: ${{ steps.publish.outputs.url }}
      run: |
        {
          cat out/summary.md
          echo
          echo "![What the pull request moved]($GRAPH_URL/graph.svg)"
          echo
          echo "[Explore every class]($GRAPH_URL/report.html)"
        } > comment.md
        cat comment.md >> "$GITHUB_STEP_SUMMARY"
        comment=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- what-moved -->")) | .id' | head -n 1)
        if [ -n "$comment" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$comment" -F body=@comment.md > /dev/null
        else
          gh pr comment "$PR" --repo "$REPO" --body-file comment.md
        fi
